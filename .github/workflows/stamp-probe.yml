name: stamp-probe
# How a record of a passed job can be kept and found, for the plan of test selection.
on:
  workflow_dispatch:
    inputs:
      key: {required: true}
      mode: {required: true}   # save, find, empty, some
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: stamp
          key: passed-${{ inputs.key }}
          lookup-only: true
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          KEY: ${{ inputs.key }}
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          s=$(date +%s%N)
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=passed-$KEY" \
            --jq '[.artifacts[] | {expired, branch: .workflow_run.head_branch, sha: .workflow_run.head_sha[0:7], run: .workflow_run.id, repo: .workflow_run.repository_id}]')
          e=$(date +%s%N)
          echo "RESULT ref=$GITHUB_REF_NAME cache-hit=[$HIT] artifacts=$found lookup_ms=$(( (e-s)/1000000 ))"
          case "$MODE" in
            empty) echo 'matrix=[]' >> "$GITHUB_OUTPUT" ;;
            some) echo 'matrix=["b"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'matrix=["a","b"]' >> "$GITHUB_OUTPUT" ;;
          esac
  work:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - run: echo "RESULT work ran for ${{ matrix.entry }}" && mkdir stamp && echo passed > stamp/passed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'save' && matrix.entry == 'a'
        with:
          name: passed-${{ inputs.key }}
          path: stamp
          retention-days: 8
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.mode == 'save' && matrix.entry == 'a'
        with:
          path: stamp
          key: passed-${{ inputs.key }}
  after-plain:
    needs: work
    runs-on: ubuntu-24.04
    steps:
      - run: echo "RESULT after-plain ran"
  after-kept:
    needs: [plan, work]
    if: ${{ !cancelled() && (needs.work.result == 'success' || needs.work.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "RESULT after-kept ran, work was ${{ needs.work.result }}"
