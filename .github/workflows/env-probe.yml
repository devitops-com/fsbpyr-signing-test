name: env-probe
# What reaches a job of the environment release-signing from each ref: only a digest and a size of
# the throwaway key, to compare with the file it was set from.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - env:
          K: ${{ secrets.FSBPYR_RELEASE_KEY }}
        run: |
          echo "ref $GITHUB_REF: secret of $(printf %s "$K" | wc -c) bytes, $(printf %s "$K" | sha256sum | cut -d' ' -f1)"
